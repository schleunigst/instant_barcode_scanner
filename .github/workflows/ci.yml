name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze
      - run: flutter test

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test
      - run: flutter build apk --debug
      - run: ./gradlew :instant_barcode_scanner:assembleDebugAndroidTest --console=plain
        working-directory: example/android

  publish-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Publish dry-run must have no warnings
        run: |
          set -o pipefail
          dart pub publish --dry-run 2>&1 | tee /tmp/publish-dry-run.log
          if grep -Eq 'Package has [1-9][0-9]* warnings?' /tmp/publish-dry-run.log ||
             grep -q 'validation found the following warning' /tmp/publish-dry-run.log; then
            echo "::error::dart pub publish --dry-run reported warnings"
            exit 1
          fi

  android-instrumented:
    # Pin a stable image; the udev step below is what actually makes /dev/kvm
    # usable (the runner user is not in the `kvm` group). Without it the
    # emulator boots in software (~10 minutes) or the adb setup fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Required by android-emulator-runner: the runner user is not in the
      # `kvm` group, so /dev/kvm is inaccessible until the device is opened up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # android-emulator-runner runs each script line with its own `sh -c`,
          # so every line must carry its own `cd`. The Dart integration suite
          # needs a real camera and hangs on a hosted emulator; the mechanism's
          # own instrumented tests use GrantPermissionRule and explicit
          # timeouts, so they are the automatable device gate.
          script: |
            cd example && flutter pub get
            cd example/android && ./gradlew :instant_barcode_scanner:connectedDebugAndroidTest --console=plain
