name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze
      - run: flutter test

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test
      - run: flutter build apk --debug
      - run: ./gradlew :instant_barcode_scanner:assembleDebugAndroidTest --console=plain
        working-directory: example/android

  publish-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Publish dry-run must have no warnings
        run: |
          set -o pipefail
          dart pub publish --dry-run 2>&1 | tee /tmp/publish-dry-run.log
          if grep -Eq 'Package has [1-9][0-9]* warnings?' /tmp/publish-dry-run.log ||
             grep -q 'validation found the following warning' /tmp/publish-dry-run.log; then
            echo "::error::dart pub publish --dry-run reported warnings"
            exit 1
          fi

  android-instrumented:
    # GitHub's ubuntu-latest image migrates over time and some images expose
    # /dev/kvm without granting the runner user access. Without KVM the x86_64
    # emulator boots in software (11+ minutes) and the adb post-boot setup
    # fails. Pin an image with working KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # android-emulator-runner runs each script line with its own `sh -c`,
          # so every line must carry its own `cd`. `flutter test` performs the
          # build and install itself; a second explicit install roughly doubles
          # the slowest step on a software-GPU emulator. The background watcher
          # grants CAMERA as soon as the app appears, then keeps re-granting so
          # a reinstall cannot leave the test on a permission dialog.
          script: |
            cd example && flutter pub get
            cd example && (while true; do adb shell pm grant dev.instantbarcode.instant_barcode_scanner_example android.permission.CAMERA >/dev/null 2>&1; sleep 0.2; done) & cd example && flutter test integration_test -d emulator-5554
